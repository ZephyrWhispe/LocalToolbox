<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalToolbox</title>
<link rel="stylesheet" href="css/app.css">
<script>
  window.__push = function (m) {
    if (window.App && App.dispatch) { App.dispatch(m.event, m.data); }
    else { (window.__q = window.__q || []).push(m); }
  };
</script>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand">
      <span class="logo" title="LocalToolbox —— 局域网互联与协作工具箱">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-9-5.5-9-11a5.4 5.4 0 0 1 9-3.9A5.4 5.4 0 0 1 21 10c0 5.5-9 11-9 11z"/><path d="M9 10l6 6M15 10l-6 6"/></svg>
      </span>
      <b>LocalToolbox</b>
      <span class="brand-sub">局域网互联与协作工具箱</span>
      <span class="ver" id="app-ver"></span>
    </div>
    <div class="titlebar-right">
      <button id="nav-toggle" class="icon-btn drawer-toggle" title="显示/隐藏导航">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <button id="devices-toggle" class="icon-btn drawer-toggle" title="显示/隐藏设备面板">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" title="切换深色/浅色主题"></button>
      <span class="divider"></span>
      <button id="win-min" class="icon-btn" title="最小化">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="win-max" class="icon-btn" title="最大化 / 还原">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg>
      </button>
      <button id="win-close" class="icon-btn close" title="关闭（最小化到托盘）">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <nav id="nav"></nav>

  <main id="content"></main>

  <aside id="devices">
    <div class="panel-head">
      <span>局域网设备</span>
      <span class="count" id="dev-count">0</span>
    </div>
    <div id="dev-list"></div>
    <div class="panel-foot">同一局域网内运行本软件的设备会自动出现在这里</div>
  </aside>

  <footer id="statusbar">
    <span id="status-msg">就绪</span>
    <span id="status-right"></span>
  </footer>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script src="js/vendor/marked.min.js"></script>
<script src="js/vendor/purify.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/bridge.js"></script>
<script src="js/window_drag.js"></script>
<script src="js/pages/clipboard.js"></script>
<script src="js/pages/services.js"></script>
<script src="js/pages/km.js"></script>
<script src="js/pages/transfer.js"></script>
<script src="js/pages/share.js"></script>
<script src="js/pages/ftp.js"></script>
<script src="js/pages/web.js"></script>
<script src="js/pages/file.js"></script>
<script src="js/pages/ocr.js"></script>
<script src="js/pages/scan.js"></script>
<script src="js/pages/network.js"></script>
<script src="js/pages/memo.js"></script>
<script src="js/pages/vault.js"></script>
<script src="js/pages/pan.js"></script>
<script src="js/pages/v2ray.js"></script>
<script src="js/pages/clash.js"></script>
<script src="js/pages/routing.js"></script>
<script src="js/pages/shellmenu.js"></script>
<script src="js/pages/tools.js"></script>
<script src="js/pages/region_capture.js"></script>
<script src="js/pages/screenshot.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/firewall.js"></script>
<script src="js/pages/editor.js"></script>
<script src="js/pages/cliphist.js"></script>
<script src="js/pages/combine.js"></script>
<script src="js/pages/split.js"></script>
<script src="js/pages/batch.js"></script>
<script src="js/pages/video.js"></script>
<script src="js/app.js"></script>
</body>
</html>
