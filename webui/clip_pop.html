<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>剪贴板</title>
<style>
  /* 设计令牌（同步自 app.css :3-47；弹窗为注入式独立页无法引用外部 CSS） */
  :root, body.dark {
    --bg: #0e1319; --bg2: #121924; --panel: #151d28; --card: #1a2532;
    --card2: #213040; --hover: #24354a;
    --border: rgba(255, 255, 255, 0.08); --border2: rgba(255, 255, 255, 0.14);
    --text: #e8eef6; --muted: #92a1b3; --faint: #5d6b7c;
    --accent: #4c8dff; --accent-soft: rgba(76, 141, 255, 0.16);
    --ok: #37b48f; --danger: #ff6b6b; --warn: #ffb454;
  }
  body.light {
    --bg: #f2f5f9; --bg2: #eaeff5; --panel: #ffffff; --card: #ffffff;
    --card2: #f0f4f9; --hover: #e4ecf5;
    --border: rgba(15, 30, 50, 0.1); --border2: rgba(15, 30, 50, 0.18);
    --text: #1b2733; --muted: #5b6b7d; --faint: #8d9bab;
    --accent: #2f6fe4; --accent-soft: rgba(47, 111, 228, 0.12);
    --ok: #1d9e77; --danger: #d64545; --warn: #c07c1d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border2); border-radius: 10px;
    display: flex; flex-direction: column; user-select: none;
  }
  #pop-search {
    margin: 8px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--bg2); color: var(--text);
    font-size: 13px; outline: none; flex: none;
  }
  #pop-search:focus { border-color: var(--accent); }
  #pop-main { flex: 1; display: flex; min-height: 0; }
  #pop-list { flex: 1; overflow-y: auto; padding: 0 6px 6px; }
  .pop-item {
    padding: 7px 9px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 3px; position: relative;
  }
  .pop-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .pop-item.multi { border-color: var(--warn); }
  .pop-item .pin { position: absolute; right: 8px; top: 7px; font-size: 11px; }
  .pop-item .snippet {
    font-size: 12px; line-height: 1.45; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; white-space: pre-wrap; word-break: break-all;
  }
  .pop-item .meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .pop-item img.thumb {
    max-width: 100%; max-height: 88px; border-radius: 6px;
    border: 1px solid var(--border); display: block;
  }
  #pop-preview {
    display: none; flex: none; width: 0; border-left: 1px solid var(--border);
    overflow: auto; padding: 10px; background: var(--bg2);
    font-size: 12px; white-space: pre-wrap; word-break: break-all;
    line-height: 1.5; user-select: text;
  }
  #pop-preview.show { display: block; width: 240px; }
  #pop-preview img { max-width: 100%; border-radius: 6px; }
  #pop-status {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); background: var(--bg2);
  }
  #pop-status .grow { flex: 1; }
  .pv-btn {
    padding: 2px 10px; border-radius: 6px; border: 1px solid var(--border2);
    background: var(--card2); color: var(--muted); font-size: 11px; cursor: pointer;
  }
  .pv-btn:hover { color: var(--text); border-color: var(--accent); }
  .pv-btn.on { color: var(--accent); border-color: var(--accent); }
  #pop-ctx {
    position: fixed; z-index: 50; display: none; min-width: 150px;
    background: var(--card); border: 1px solid var(--border2); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35); padding: 4px;
  }
  #pop-ctx .ctx-item {
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; border-radius: 6px;
  }
  #pop-ctx .ctx-item:hover { background: var(--hover); }
  #pop-ctx .ctx-item.dis { color: var(--faint); cursor: default; }
  #pop-ctx .ctx-item.dis:hover { background: transparent; }
  #pop-toast {
    position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);
    padding: 7px 14px; border-radius: 8px; font-size: 12px; display: none;
    background: var(--card); border: 1px solid var(--border2);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .3); z-index: 60; max-width: 90%;
  }
  #pop-toast.warn { color: var(--warn); }
  #pop-toast.ok { color: var(--ok); }
</style>
</head>
<body class="dark">
<input id="pop-search" placeholder="搜索剪贴板历史…" autocomplete="off">
<div id="pop-main">
  <div id="pop-list"></div>
  <div id="pop-preview"></div>
</div>
<div id="pop-status">
  <span id="pop-count">0/0</span>
  <span class="grow"></span>
  <span>Enter 粘贴 · Ctrl+Enter 纯文本 · Alt+Enter 去换行 · F3 预览 · Esc 关闭</span>
  <button id="pop-pv" class="pv-btn" title="预览面板（F3）">预览</button>
</div>
<div id="pop-ctx"></div>
<div id="pop-toast"></div>
<script>/*__POP_JS__*/</script>
<script>
/* 引导：等待 pywebview API 就绪后启动（pywebviewready + 1.5s 兜底），cfg 由后端注入。 */
(function () {
  "use strict";
  var cfg = /*__CFG_JSON__*/;
  var started = false;
  function start() {
    if (started) return;
    started = true;
    if (window.ClipPop && window.ClipPop.start) window.ClipPop.start(cfg);
  }
  if (window.pywebview && window.pywebview.api) start();
  else {
    window.addEventListener("pywebviewready", start);
    setTimeout(start, 1500);
  }
})();
</script>
</body>
</html>
